# Токены каталогов MovieRenamer.
# Реальный токен не пушить: в Git оставляйте только слово плейсхолдер.

# --- TMDB ---
# Где взять: https://www.themoviedb.org/ → аккаунт → Settings → API.
# Нужен API Read Access Token (не короткий API Key).
# Как выглядит: длинный JWT из трёх частей через точку, начинается с eyJ.
TMDB_API_TOKEN=плейсхолдер

# --- ПоискКино (КП) ---
# Токен выдаёт бот https://t.me/poiskkinodev_bot
# Как выглядит: одна строка-ключ API, без слова Bearer и без кавычек.
POISKKINO_API_TOKEN=плейсхолдер
